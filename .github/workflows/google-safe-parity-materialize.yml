name: Google safe parity materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: google-safe-parity-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'reliability/google-safe-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: reliability/google-safe-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: python3 scripts/_tmp_google_safe_parity.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Commit validated source patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/google-safe-parity-materialize.yml scripts/_tmp_google_safe_parity.py
          git add src/core/google.ts tests/google.test.ts tests/google-safe-parity.test.ts
          git diff --cached --check
          git commit -m "fix(google): align Gemini transforms with coding-safe policy"
          git push origin HEAD:reliability/google-safe-parity
