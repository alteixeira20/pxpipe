name: Materialize AGY dashboard fix

on:
  push:
    branches: [fix/agy-dashboard-end-to-end]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.head.label, '[materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/agy-dashboard-end-to-end
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patch
        run: |
          python3 scripts/fix-materializer-syntax.py
          node scripts/materialize-agy-dashboard-fix.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Commit validated materialization
        run: |
          rm scripts/materialize-agy-dashboard-fix.mjs
          rm scripts/fix-materializer-syntax.py
          rm .github/workflows/materialize-agy-dashboard.yml
          git config user.name "pxpipe reliability bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(agy): route Antigravity through persistent PXPipe [materialized]"
          git push origin HEAD:fix/agy-dashboard-end-to-end
