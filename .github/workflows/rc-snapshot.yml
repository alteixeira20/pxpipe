name: RC promote validated runtime

on:
  push:
    branches:
      - stabilize/rc-runtime-parity-20260811

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Apply already-validated runtime patches
        run: |
          cat .github/rc/runtime.part* | base64 -d > /tmp/runtime.patch
          echo '4501be8f67e193c1d1fc723f4aeb0e089d9eb775d653b38fd3463bc46d62a7d0  /tmp/runtime.patch' | sha256sum -c -
          git apply /tmp/runtime.patch
          cat .github/rc/ts7.part* | base64 -d > /tmp/ts7.patch
          echo 'dec97e2b0e4ccb53042fa6277c9008f9d2536f4076f89166dfad969938608a1b  /tmp/ts7.patch' | sha256sum -c -
          git apply /tmp/ts7.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/node.ts')
          s = p.read_text()
          old = """async function writeWebResponse(res: Response, out: ServerResponse): Promise<void> {\n  out.statusCode = res.status;\n  res.headers.forEach((v, k) => out.setHeader(k, v));\n  if (!res.body) {\n    out.end();\n    return;\n  }\n"""
          new = """async function writeWebResponse(res: Response, out: ServerResponse): Promise<void> {\n  out.statusCode = res.status;\n  res.headers.forEach((v, k) => out.setHeader(k, v));\n  // HEAD must return the GET metadata without attempting to stream a body.\n  // node:http suppresses HEAD response bytes at the socket layer, but reading\n  // and writing the Web Response body can still race the client closing after\n  // headers and surface a spurious response-close error in our bridge.\n  if (out.req?.method === 'HEAD' || !res.body) {\n    if (res.body) void res.body.cancel().catch(() => undefined);\n    out.end();\n    return;\n  }\n"""
          assert old in s
          p.write_text(s.replace(old, new))
          p = Path('tests/render.test.ts')
          s = p.read_text()
          s = s.replace("it('strips x-anthropic-billing-header line and keeps it as text', async () => {", "it('strips x-anthropic-billing-header from the body and exposes it for HTTP forwarding', async () => {")
          old = """    const out = JSON.parse(new TextDecoder().decode(body));\n    const textBlocks = out.system.filter((b: any) => b.type === 'text');\n    expect(textBlocks.some((b: any) => b.text.includes('x-anthropic-billing-header'))).toBe(true);\n"""
          new = """    const outText = new TextDecoder().decode(body);\n    expect(outText).not.toContain('x-anthropic-billing-header');\n    expect(info.billingLine).toBe('x-anthropic-billing-header: cch=abc123');\n"""
          assert old in s
          s = s.replace(old, new)
          s = s.replace("it('relocates the header to the system tail from every position', async () => {", "it('extracts the header for transport from every position without re-emitting it', async () => {")
          old = """        const { body } = await transformRequest(bytes);\n        const out = JSON.parse(new TextDecoder().decode(body));\n        const texts = out.system.filter((b: any) => b.type === 'text').map((b: any) => b.text);\n        expect(texts.some((t: string) => t.includes(HDR))).toBe(true);\n"""
          new = """        const { body, info } = await transformRequest(bytes);\n        expect(new TextDecoder().decode(body)).not.toContain(HDR);\n        expect(info.billingLine).toBe(HDR);\n"""
          assert old in s
          p.write_text(s.replace(old, new))
          PY
      - name: Refresh lock and promote clean diff
        run: |
          pnpm install --no-frozen-lockfile
          rm -rf .github/rc .github/workflows/rc-snapshot.yml
          git add -A
          git diff --cached --check
          git config user.name 'pxpipe-rc-bot'
          git config user.email 'pxpipe-rc-bot@users.noreply.github.com'
          git commit -m 'fix(rc): harden runtime parity and portability'
          git push origin HEAD:stabilize/rc-runtime-parity-20260811
