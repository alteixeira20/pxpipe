name: Trajectory guard materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trajectory-guard-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'reliability/trajectory-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: reliability/trajectory-guard
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: python3 scripts/_tmp_trajectory_guard.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Commit validated source patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/trajectory-guard-materialize.yml scripts/_tmp_trajectory_guard.py
          git add src/core/proxy.ts src/core/tracker.ts src/core/index.ts src/core/trajectory.ts src/core/trajectory-policy.ts tests/trajectory.test.ts tests/trajectory-policy.test.ts tests/trajectory-tracker.test.ts
          git diff --cached --check
          git commit -m "feat(reliability): detect and break repeated retrieval loops"
          git push origin HEAD:reliability/trajectory-guard
