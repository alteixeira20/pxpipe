name: RC Codex cache-stable optimizer

on:
  push:
    branches:
      - fix/codex-cache-stable-history

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.21.0 --activate
      - name: Decide whether this is the staging commit
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "chore(rc): stage codex cache-stable optimizer" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "Product commit already promoted; nothing to restage."
          fi
      - name: Verify and apply audited patch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/rc-codex/part00 \
            .github/rc-codex/part01 \
            .github/rc-codex/part02 \
            .github/rc-codex/part03 \
            .github/rc-codex/part04 \
            .github/rc-codex/part05 \
            .github/rc-codex/part06 \
            > /tmp/codex-feature.patch.gz
          echo 'ab023c6c70cd69cbfff63376d2e8c020c495fffe8d3bc5d24a5cc3d993e0eac1  /tmp/codex-feature.patch.gz' | sha256sum -c -
          gzip -dc /tmp/codex-feature.patch.gz > /tmp/codex-feature.patch
          echo '730c4d6d33fe835fd979424abaaef78a4c361902ed8d2b0f173ee6d7bc3020aa  /tmp/codex-feature.patch' | sha256sum -c -
          git apply --3way --check /tmp/codex-feature.patch
          git apply --3way /tmp/codex-feature.patch
          git diff --check
      - name: Use realistic token-dense Codex cache fixture
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/openai-gpt5.test.ts')
          text = path.read_text()
          old = "        output: `file-${i} ${'stable repository content identifier function_name path/to/file '.repeat(950)}`,”
          if old not in text:
              old = "        output: `file-${i} ${'stable repository content identifier function_name path/to/file '.repeat(950)}`,”.replace(',”', '`,')
          new = """        output: Array.from({ length: 120 }, (_, j) =>
          `file_${i}_${j}.ts symbol_${i}_${j} arg_${j}=value_${i}_${j} checksum=${(i * 1000 + j).toString(16).padStart(8, '0')} path=/tmp/repo_${i}/module_${j}/handler_${j}.ts`
        ).join('\\n'),"""
          assert text.count(old) == 1, 'unexpected Codex cache fixture shape'
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Production audit
        if: steps.gate.outputs.run == 'true'
        run: pnpm run audit
      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: pnpm run typecheck
      - name: Focused Codex regressions
        if: steps.gate.outputs.run == 'true'
        run: >-
          pnpm vitest run
          tests/openai-history.test.ts
          tests/openai-gpt5.test.ts
          tests/codex-cache-state.test.ts
          tests/codex-economics.test.ts
          tests/codex-runtime-model.test.ts
          tests/codex-readiness-contract.test.ts
      - name: Full suite
        if: steps.gate.outputs.run == 'true'
        run: pnpm test
      - name: Restart integration
        if: steps.gate.outputs.run == 'true'
        run: pnpm run test:restart
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: pnpm run build
      - name: Worker dry run
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec wrangler deploy --dry-run
      - name: Promote validated product source
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PXPipe RC Bot'
          git config user.email 'pxpipe-rc@example.invalid'
          git add \
            README.md \
            docs/CACHING_AND_SAVINGS.md \
            docs/CODEX_INTEGRATION.md \
            src/codex-entry.ts \
            src/core/codex-cache-state.ts \
            src/core/codex-economics.ts \
            src/core/gpt-model-profiles.ts \
            src/core/openai-history.ts \
            src/core/openai.ts \
            src/core/proxy.ts \
            src/core/transform.ts \
            src/node.ts \
            tests/codex-cache-state.test.ts \
            tests/codex-economics.test.ts \
            tests/openai-gpt5.test.ts \
            tests/openai-history.test.ts
          git diff --cached --check
          git commit -m 'fix(codex): preserve cache across protocol-aware history compression'
          git push origin HEAD:fix/codex-cache-stable-history
