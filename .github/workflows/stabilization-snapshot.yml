name: Stabilization Source Snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'stabilize/full-hardening-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pack exact checkout
        run: tar --exclude=.git -czf /tmp/pxpipe-stabilization-source.tgz .
      - name: Upload checkout
        uses: actions/upload-artifact@v4
        with:
          name: pxpipe-stabilization-source
          path: /tmp/pxpipe-stabilization-source.tgz
          if-no-files-found: error
          retention-days: 1
