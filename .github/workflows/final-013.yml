name: Validate final 0.13 session isolation

on:
  push:
    branches: [release/0.13-reliability]
    paths:
      - .github/final-013.py
      - .github/final-fix.py
      - .github/workflows/final-013.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: final-013-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'release/0.13-reliability')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.13-reliability
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Materialize final session isolation
        run: |
          python3 .github/final-013.py
          python3 .github/final-fix.py
          git rm .github/final-013.py .github/final-fix.py .github/workflows/final-013.yml
          git diff --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Commit validated final session isolation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(reliability): isolate AGY trajectory sessions"
          git push origin HEAD:release/0.13-reliability
